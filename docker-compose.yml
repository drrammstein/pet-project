services:
  postgres:
    image: postgres:15-alpine
    container_name: petproject-postgres
    environment:
      POSTGRES_DB: petprojectdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: SecurePassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d petprojectdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: petproject-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: SecurePassword123!
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  webapi:
    build:
      context: .
      dockerfile: src/WebApi/Dockerfile
    container_name: petproject-webapi
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=petprojectdb;Username=admin;Password=SecurePassword123!
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=admin
      - RabbitMQ__Password=SecurePassword123!
      - RabbitMQ__QueueName=update-value-queue
    volumes:
      - ./logs:/app/logs
      - ./src/WebApi/appsettings.Development.json:/app/appsettings.Development.json:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/WorkerService/Dockerfile
    container_name: petproject-worker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=petprojectdb;Username=admin;Password=SecurePassword123!
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=admin
      - RabbitMQ__Password=SecurePassword123!
      - RabbitMQ__QueueName=update-value-queue
    volumes:
      - ./logs:/app/logs
      - ./src/WorkerService/appsettings.json:/app/appsettings.json:ro
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
